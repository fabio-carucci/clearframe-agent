packages:
  - apps/*
  - packages/*
  - evals

allowBuilds:
  esbuild: true

# Minutes a release must have been public before pnpm installs it. One day is pnpm 11's default,
# written down so it does not depend on the pnpm version; Dependabot waits a week before proposing
# an update.
minimumReleaseAge: 1440
