packages:
  - apps/*
  - packages/*
  - evals

allowBuilds:
  esbuild: true

# Minutes a release must have been public before pnpm installs it. One day is pnpm 11's default,
# written down so it does not depend on the pnpm version. pnpm also checks the lockfile against it,
# and Dependabot's week-long cooldown covers direct dependencies only: their transitive ones arrive
# newer, so three days already rejects locked packages and would fail Dependabot's pull requests.
minimumReleaseAge: 1440
