name: Deploy dev

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "evals/reports/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lambda

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - run: terraform -chdir=infra/env/dev init -input=false
      - run: terraform -chdir=infra/env/dev plan -input=false -out=tfplan
      - run: terraform -chdir=infra/env/dev apply -input=false tfplan
