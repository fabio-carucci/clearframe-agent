name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agent: ${{ steps.diff.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A pull_request checkout is a merge commit whose first parent is the base branch, so this
      # diff is exactly what the pull request changes.
      - id: diff
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -v '^evals/reports/' \
            | grep -qE '^(packages|evals|data)/|^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/ci\.yml)$'; then
            echo "agent=true" >> "$GITHUB_OUTPUT"
          else
            echo "agent=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:lambda
      - run: pnpm build:notary
      - run: pnpm web:build

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.15"
      - run: terraform fmt -check -recursive infra
      - name: terraform validate
        run: |
          for stack in infra/bootstrap infra/env/dev infra/github; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

  evals:
    needs: [checks, changes]
    # Skipped by this condition, the job reports success and can stay a required check. A
    # workflow-level paths filter would leave the check pending and block the merge instead.
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: eu-west-1
      - name: Load the CI Anthropic key from SSM
        run: |
          key=$(aws ssm get-parameter --name /clearframe/ci/anthropic-api-key \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$key"
          echo "ANTHROPIC_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Run evals (fails on a rights violation, an error, or a metric below its threshold)
        run: pnpm eval --min-recall 0.9 --min-precision 0.95
      - name: Publish the report
        if: always()
        run: cat evals/reports/latest-with-rule.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: eval-report
          path: evals/reports/latest-with-rule.*
