version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days; a week of waiting keeps it
    # out of the lockfile. Longer than minimumReleaseAge in pnpm-workspace.yaml, which Dependabot
    # may not apply.
    cooldown:
      default-days: 7
    groups:
      # The agent loop depends on these together; the evals job runs on any lockfile change.
      ai-sdk:
        patterns: ["ai", "@ai-sdk/*"]
      aws-sdk:
        patterns: ["@aws-sdk/*"]
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
